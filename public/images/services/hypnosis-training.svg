<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="hypBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281D" />
      <stop offset="100%" stop-color="#0A160F" />
    </linearGradient>
    <linearGradient id="spiralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDCBF" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#826644" />
    </linearGradient>
    <linearGradient id="portalCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>
    <radialGradient id="tranceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#466E53" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#14281D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#hypBg)" rx="16" />

  <!-- Ambient Trance Glow -->
  <circle cx="200" cy="125" r="110" fill="url(#tranceGlow)" />

  <!-- Soft Concentric Circular Flow / Hypnotic Focus Rings -->
  <circle cx="200" cy="125" r="95" fill="none" stroke="url(#spiralGold)" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.3" />
  <circle cx="200" cy="125" r="80" fill="none" stroke="url(#spiralGold)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.45" />
  <circle cx="200" cy="125" r="65" fill="none" stroke="url(#spiralGold)" stroke-width="1.8" opacity="0.6" />
  <circle cx="200" cy="125" r="50" fill="none" stroke="url(#spiralGold)" stroke-width="2.2" stroke-dasharray="4 4" opacity="0.75" />
  <circle cx="200" cy="125" r="35" fill="none" stroke="url(#spiralGold)" stroke-width="2.5" opacity="0.9" />
  <circle cx="200" cy="125" r="20" fill="none" stroke="url(#portalCenter)" stroke-width="3" />

  <!-- Center Golden Focus Core -->
  <circle cx="200" cy="125" r="8" fill="url(#portalCenter)" />
  <circle cx="200" cy="125" r="3" fill="#FFF" />

  <!-- Flowing Wave / Subconscious Mind Resonance Ribbon -->
  <path d="M 50,175 C 110,135 150,165 200,125 C 250,85 290,115 350,75" stroke="url(#spiralGold)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 50,75 C 110,115 150,85 200,125 C 250,165 290,135 350,175" stroke="url(#spiralGold)" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Abstract Peaceful Profile Silhouette facing focus point -->
  <g fill="#D4C3A3" opacity="0.25">
    <!-- Subtle left silhouette contour -->
    <circle cx="100" cy="125" r="18" />
    <path d="M 100,145 C 80,148 65,168 66,200 L 134,200 C 135,168 120,148 100,145 Z" />
  </g>

  <!-- Star points around concentric rings -->
  <circle cx="260" cy="80" r="2.5" fill="#FFEAB8" opacity="0.8" />
  <circle cx="140" cy="170" r="2" fill="#FFEAB8" opacity="0.7" />
  <circle cx="245" cy="175" r="2" fill="#FFEAB8" opacity="0.6" />
  <circle cx="155" cy="75" r="2" fill="#FFEAB8" opacity="0.6" />
</svg>
