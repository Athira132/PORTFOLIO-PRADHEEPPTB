<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="nlpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </linearGradient>
    <linearGradient id="mindGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142F21" />
      <stop offset="100%" stop-color="#0B1A12" />
    </linearGradient>
    <linearGradient id="synapseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>
    <radialGradient id="nlpAura" cx="60%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E2D4B7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F7F5EE" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#nlpBg)" rx="16" />

  <!-- Mental expansion aura -->
  <circle cx="230" cy="115" r="95" fill="url(#nlpAura)" />

  <!-- Editorial Head Profile (Looking forward to the right) -->
  <g fill="url(#mindGrad)">
    <!-- Elegant faceless head profile contour -->
    <path d="M 120,215 L 120,180 C 120,155 125,140 135,120 C 145,100 160,75 195,75 C 235,75 255,95 260,118 C 263,130 258,138 252,142 C 255,148 258,155 252,165 C 248,170 240,172 235,172 C 230,178 225,182 220,185 L 220,215 Z" />
  </g>

  <!-- Neural Network / Interconnected Cognitive Pathways (inside & around mind) -->
  <!-- Connection Lines -->
  <g stroke="url(#synapseGold)" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="185" y1="105" x2="215" y2="95" />
    <line x1="215" y1="95" x2="245" y2="115" />
    <line x1="185" y1="105" x2="195" y2="135" />
    <line x1="195" y1="135" x2="230" y2="140" />
    <line x1="215" y1="95" x2="230" y2="140" />
    <line x1="245" y1="115" x2="230" y2="140" />

    <!-- Outward Cognitive Reframing Rays -->
    <line x1="245" y1="115" x2="295" y2="90" stroke-dasharray="3 3" />
    <line x1="245" y1="115" x2="310" y2="125" />
    <line x1="230" y1="140" x2="290" y2="160" stroke-dasharray="3 3" />
    <line x1="215" y1="95" x2="270" y2="65" />
  </g>

  <!-- Golden Synaptic Nodes -->
  <circle cx="185" cy="105" r="5" fill="#C5A880" />
  <circle cx="215" cy="95" r="6" fill="#F4E2C2" stroke="#C5A880" stroke-width="2" />
  <circle cx="245" cy="115" r="7" fill="#C5A880" />
  <circle cx="195" cy="135" r="4.5" fill="#C5A880" />
  <circle cx="230" cy="140" r="5.5" fill="#F4E2C2" stroke="#C5A880" stroke-width="2" />

  <!-- Outward Thought Projection Nodes -->
  <circle cx="295" cy="90" r="5" fill="#84A78E" />
  <circle cx="310" cy="125" r="7" fill="#C5A880" />
  <circle cx="290" cy="160" r="4" fill="#84A78E" />
  <circle cx="270" cy="65" r="4.5" fill="#C5A880" />

  <!-- Dynamic Cognitive Breakthrough Sparkles -->
  <path d="M 310,115 L 310,135 M 300,125 L 320,125" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
  <circle cx="335" cy="105" r="2.5" fill="#C5A880" opacity="0.8" />
  <circle cx="330" cy="145" r="2" fill="#84A78E" opacity="0.7" />

  <!-- Subtle Harmonic Speech Resonance Waves -->
  <path d="M 265,160 Q 285,160 295,150" stroke="#C5A880" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 270,170 Q 295,170 310,155" stroke="#C5A880" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5" />
</svg>
