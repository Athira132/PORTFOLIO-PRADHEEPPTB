<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="coupleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3ED" />
      <stop offset="100%" stop-color="#E7E0D3" />
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E0D6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C5D3C4" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="personA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3828" />
      <stop offset="100%" stop-color="#102319" />
    </linearGradient>
    <linearGradient id="personB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#556E5A" />
      <stop offset="100%" stop-color="#3A503E" />
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC96" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#coupleBg)" rx="16" />

  <!-- Backdrop arch & aura of dialogue -->
  <ellipse cx="200" cy="140" rx="100" ry="80" fill="url(#glowCircle)" />
  <path d="M 140,215 L 260,215" stroke="#C5A880" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Harmonic dialogue resonance waves connecting minds/hearts -->
  <path d="M 175,115 C 190,105 210,105 225,115" stroke="url(#goldArch)" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-dasharray="3 3" />
  <path d="M 170,135 C 190,122 210,122 230,135" stroke="url(#goldArch)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 175,155 C 190,165 210,165 225,155" stroke="url(#goldArch)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Left Partner Silhouette (Sitting) -->
  <circle cx="145" cy="100" r="16" fill="url(#personA)" />
  <path d="M 145,118 C 130,120 120,138 122,165 L 122,215 L 140,215 L 142,175 C 145,170 155,170 162,172 L 168,215 L 180,215 L 175,160 C 172,145 165,120 145,118 Z" fill="url(#personA)" />

  <!-- Right Partner Silhouette (Sitting) -->
  <circle cx="255" cy="100" r="16" fill="url(#personB)" />
  <path d="M 255,118 C 270,120 280,138 278,165 L 278,215 L 260,215 L 258,175 C 255,170 245,170 238,172 L 232,215 L 220,215 L 225,160 C 228,145 235,120 255,118 Z" fill="url(#personB)" />

  <!-- Center Heart-Resonance Emblem -->
  <circle cx="200" cy="130" r="12" fill="#FAF7F2" stroke="#C5A880" stroke-width="1.5" />
  <path d="M 196,128 C 194,124 198,122 200,125 C 202,122 206,124 204,128 L 200,133 Z" fill="#C5A880" />

  <!-- Subtle leaves around base -->
  <path d="M 70,215 Q 85,185 105,175" stroke="#9BB098" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <circle cx="105" cy="175" r="3" fill="#9BB098" opacity="0.6" />
  <path d="M 330,215 Q 315,185 295,175" stroke="#9BB098" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <circle cx="295" cy="175" r="3" fill="#9BB098" opacity="0.6" />
</svg>
