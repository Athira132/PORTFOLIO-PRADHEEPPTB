<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="stressBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F4" />
      <stop offset="100%" stop-color="#E2ECE3" />
    </linearGradient>
    <linearGradient id="waveGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ADC7B4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#84A78E" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="calmSilhouette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153323" />
      <stop offset="100%" stop-color="#0D2016" />
    </linearGradient>
    <linearGradient id="zenAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D8BE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#stressBg)" rx="16" />

  <!-- Calming Aura circle behind figure -->
  <circle cx="200" cy="120" r="85" fill="url(#zenAura)" />

  <!-- Gentle undulating tranquility waves -->
  <path d="M 0,165 Q 100,145 200,165 T 400,165 L 400,250 L 0,250 Z" fill="url(#waveGradA)" opacity="0.4" />
  <path d="M 0,185 Q 120,165 240,185 T 400,185 L 400,250 L 0,250 Z" fill="#95B59E" opacity="0.3" />
  <path d="M 0,210 Q 90,195 200,210 T 400,205 L 400,250 L 0,250 Z" fill="#7D9F86" opacity="0.3" />

  <!-- Floating Botanical Eucalyptus / Olive Leaves -->
  <!-- Left spray -->
  <g stroke="#688C72" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M 45,180 Q 75,130 90,85" />
    <path d="M 68,142 Q 52,130 50,118" />
    <ellipse cx="50" cy="118" rx="6" ry="11" fill="#7D9F86" stroke="none" transform="rotate(-20 50 118)" opacity="0.8" />
    <ellipse cx="88" cy="110" rx="6" ry="12" fill="#7D9F86" stroke="none" transform="rotate(25 88 110)" opacity="0.8" />
    <ellipse cx="90" cy="85" rx="5" ry="10" fill="#7D9F86" stroke="none" opacity="0.85" />
  </g>
  <!-- Right floating leaf -->
  <ellipse cx="320" cy="90" rx="7" ry="14" fill="#C5A880" opacity="0.7" transform="rotate(35 320 90)" />
  <ellipse cx="345" cy="120" rx="5" ry="10" fill="#84A78E" opacity="0.6" transform="rotate(-15 345 120)" />

  <!-- Faceless Person Silhouette in Serene Profile / Deep Breath -->
  <!-- Head & tranquil neck/shoulders -->
  <circle cx="200" cy="92" r="18" fill="url(#calmSilhouette)" />
  <path d="M 200,112 C 180,115 158,135 156,170 C 154,195 160,215 162,215 L 238,215 C 240,215 246,195 244,170 C 242,135 220,115 200,112 Z" fill="url(#calmSilhouette)" />

  <!-- Golden Heart Center & Breathing Resonance Lines -->
  <circle cx="200" cy="148" r="5" fill="#C5A880" />
  <circle cx="200" cy="148" r="14" fill="none" stroke="#C5A880" stroke-width="1.5" opacity="0.8" stroke-dasharray="2 3" />
  <circle cx="200" cy="148" r="26" fill="none" stroke="#C5A880" stroke-width="1.2" opacity="0.5" stroke-dasharray="3 4" />
</svg>
