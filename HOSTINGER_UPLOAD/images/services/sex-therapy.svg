<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sexThBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2" />
      <stop offset="100%" stop-color="#ECE3D6" />
    </linearGradient>
    <linearGradient id="intimacyGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E382A" />
      <stop offset="100%" stop-color="#102219" />
    </linearGradient>
    <linearGradient id="intimacyGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A77E" />
      <stop offset="100%" stop-color="#B8855A" />
    </linearGradient>
    <linearGradient id="warmthGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E7D2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E5C7A5" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#sexThBg)" rx="16" />

  <!-- Luminous Sacred Space Aura -->
  <circle cx="200" cy="125" r="95" fill="url(#warmthGlow)" />
  <circle cx="200" cy="125" r="70" fill="none" stroke="#C5A880" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />

  <!-- Two Intertwined Abstract Contours representing emotional connection & intimacy -->
  <!-- Left Contour (Organic Flowing Ribbon) -->
  <path d="M 140,210 C 140,150 170,110 190,80 C 196,70 205,75 202,85 C 195,115 165,160 160,210 Z" fill="url(#intimacyGradA)" />
  <circle cx="180" cy="72" r="14" fill="url(#intimacyGradA)" />

  <!-- Right Contour (Harmonizing Partner Ribbon embracing) -->
  <path d="M 260,210 C 260,150 230,110 210,80 C 204,70 195,75 198,85 C 205,115 235,160 240,210 Z" fill="url(#intimacyGradB)" />
  <circle cx="220" cy="72" r="14" fill="url(#intimacyGradB)" />

  <!-- Center Heart & Lotus Union of Trust & Vulnerability -->
  <ellipse cx="200" cy="125" rx="18" ry="24" fill="#FAF8F3" stroke="#C5A880" stroke-width="2" />
  <path d="M 194,124 C 191,118 196,115 200,120 C 204,115 209,118 206,124 L 200,131 Z" fill="#C5A880" />

  <!-- Harmonic Enclosure Rings of Mutual Respect & Communication -->
  <path d="M 130,125 C 130,85 160,65 200,65 C 240,65 270,85 270,125 C 270,175 200,205 200,205 C 200,205 130,175 130,125 Z" stroke="#C5A880" stroke-width="1.8" fill="none" opacity="0.6" />

  <!-- Subtle starbursts of emotional wellness -->
  <circle cx="140" cy="90" r="2.5" fill="#C5A880" opacity="0.8" />
  <circle cx="260" cy="90" r="2.5" fill="#C5A880" opacity="0.8" />
  <circle cx="200" cy="45" r="3" fill="#C5A880" opacity="0.7" />
  <circle cx="200" cy="220" r="2" fill="#C5A880" opacity="0.5" />
</svg>
